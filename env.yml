# The publication's environment: what index.ipynb and the code in src/ need,
# and Quarto, which renders the pub.
#
# List what you use without pinning versions. Calkit locks the exact versions,
# for every platform, in .calkit/env-locks/ when it creates the environment,
# so everyone who runs the pub gets the same ones. `calkit run` creates and
# updates it as this file changes; to use it yourself, run commands with
# `calkit xenv -n main -- <command>`, e.g.,
# `calkit xenv -n main -- jupyter lab`.
name: notebook-pub
channels:
  - conda-forge
dependencies:
  - python=3.13
  # Your publication's dependencies
  - matplotlib
  - pandas

  # Publication infrastructure
  - quarto
  - jupyterlab
  - pyyaml
  - pre-commit
  - ruff
  - pip
  - pip:
      - -e .  # The code in src/
      - arcadia-pycolor
      - jupyterlab-quarto
